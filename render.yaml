services:
  - type: web
    name: muyai-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PLAN_GATING_ENABLED
        value: "false"
      - key: JOBS_DEFAULT_COUNTRY
        value: remote
